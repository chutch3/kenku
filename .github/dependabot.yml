version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # .NET backend
  - package-ecosystem: "nuget"
    directory: "/api/API"
    schedule:
      interval: "weekly"

  # Nuxt frontend
  - package-ecosystem: "npm"
    directory: "/web/website"
    schedule:
      interval: "weekly"
    ignore:
      # 13.x ships no prebuilt binary for the image's Alpine/Node build, so npm ci compiles it and fails.
      - dependency-name: "better-sqlite3"
        versions: [">=13"]
