name: API Checks

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Postgres
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./Kenku.sln

      - name: Build the solution
        run: dotnet build ./Kenku.sln --configuration Release --no-restore -p:DisableOpenApiGeneration=true -m:1

      # The headless-browser tests skip without a Chromium binary; give them one so CI runs them.
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run tests with report
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: dotnet test ./Tests/Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: TestResults
          path: ./api/Tests/TestResults/TestResults.trx
